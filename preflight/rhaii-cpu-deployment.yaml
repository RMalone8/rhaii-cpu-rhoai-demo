apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference-cpu
  namespace: ai-inference-cpu-demo
  labels:
    app.kubernetes.io/name: ai-inference-cpu
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-inference-cpu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-inference-cpu
    spec:
      imagePullSecrets:
        - name: redhat-registry-pull
      volumes:
        - name: ai-inference-cache
          persistentVolumeClaim:
            claimName: ai-inference-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
      containers:
        - name: ai-inference-cpu
          image: registry.redhat.io/rhaii/vllm-cpu-rhel9:3.5.0-1786546771
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "8"
          args:
            - --model
            - /models/Qwen2.5-1.5B-Instruct
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
          volumeMounts:
            - name: ai-inference-cache
              mountPath: /models
              readOnly: true
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 15
            failureThreshold: 40
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 16Gi
