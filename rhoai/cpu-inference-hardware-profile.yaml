apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: cpu-inference-profile
  namespace: ai-inference-cpu-demo
spec:
  identifiers:
    - identifier: cpu
      displayName: CPU
      resourceType: CPU
      defaultCount: "4"
      minCount: "4"
      maxCount: "8"
    - identifier: memory
      displayName: Memory
      resourceType: Memory
      defaultCount: 8Gi
      minCount: 8Gi
      maxCount: 16Gi
